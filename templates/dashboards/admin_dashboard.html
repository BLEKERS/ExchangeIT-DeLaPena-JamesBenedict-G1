{% extends "base.html" %}
{% block title %}Admin Dashboard · ExchangeIt{% endblock %}
{% block content %}
<div class="dashboard-wrap">
  <div class="page-header dashboard-header">
    <div>
      <h1 class="text-title">Admin Dashboard - {{ request.user.full_name }}</h1>
      <p class="text-muted dashboard-subtitle">Platform overview and system status.</p>
    </div>
  </div>
  <div class="stat-grid">
    <div class="card-dark stat-card stat-card--feature">
      <span class="stat-icon-badge">
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20a6.5 6.5 0 0 1 13 0"/>
          <path d="M16 5.2a3.5 3.5 0 0 1 0 6.6"/>
          <path d="M18 14.5a5.2 5.2 0 0 1 3.5 5"/>
        </svg>
      </span>
      <div class="stat-label">Total Users</div>
      <div class="stat-value">—</div>
    </div>
    <div class="card-dark stat-card">
      <span class="stat-icon-badge stat-icon-badge--emerald">
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h4l2.5-7 5 14 2.5-7h4"/>
        </svg>
      </span>
      <div class="stat-label">System Status</div>
      <div class="stat-value">Active</div>
    </div>
  </div>
  <div class="btn-row">
    <a href="/admin/" class="btn-secondary">Open Django Admin</a>
  </div>
</div>
{% endblock %}
